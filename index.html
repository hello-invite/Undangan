<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Undangan Pernikahan Rama &amp; Tama</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--navy:#05233e;--deep:#0a1220;--cream:#f3ead6;--gold:#d9b878}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;background:var(--navy)}
body{font-family:'Poppins',sans-serif;color:var(--cream);background:var(--navy);overflow-x:hidden}
body.lock{overflow:hidden;height:100dvh}
#wrap{max-width:520px;margin:0 auto;position:relative}

/* ---------- COVER ---------- */
#cover{position:fixed;inset:0;z-index:50;background:#202a35;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:opacity 1.2s ease,visibility 1.2s}
#cover .stage{position:relative;width:min(100vw,520px);aspect-ratio:703/1250;max-height:none;animation:breathe 7s ease-in-out infinite}
#cover img{width:100%;height:100%;display:block}
#cover .name{position:absolute;left:0;right:0;top:68%;text-align:center;font-size:.85rem;font-weight:300;letter-spacing:.04em}
#cover .name b{display:block;font:400 2.1rem 'Pinyon Script',cursive;color:#fff;margin-top:2px}
.seal-ring{position:absolute;left:50.8%;top:50.4%;width:17%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;border:2px solid rgba(255,255,255,.8);animation:ring 2s ease-out infinite}
.seal-ring.b{animation-delay:1s}
#cover.open{opacity:0;visibility:hidden}
#cover.open .stage{animation:none;transform:scale(1.35);transition:transform 1.3s cubic-bezier(.6,0,.2,1)}
@keyframes breathe{50%{transform:scale(1.025)}}
@keyframes ring{from{transform:translate(-50%,-50%) scale(.8);opacity:.9}to{transform:translate(-50%,-50%) scale(1.9);opacity:0}}

/* ---------- SLIDES ---------- */
.slide{position:relative;overflow:hidden;opacity:0;transform:translateY(50px) scale(.97);filter:blur(5px);transition:opacity 1.2s ease,transform 1.2s cubic-bezier(.2,.7,.2,1),filter 1.2s}
.slide.show{opacity:1;transform:none;filter:none}
.slide img.bg{width:100%;display:block;aspect-ratio:703/1250;transform:scale(1)}
.slide.show img.bg{animation:kb 16s ease-in-out infinite alternate}
@keyframes kb{to{transform:scale(1.06)}}
.ov{position:absolute;left:0;right:0;text-align:center}
.btn{display:inline-block;border:1px solid var(--gold);border-radius:999px;padding:11px 26px;background:rgba(5,35,62,.65);color:var(--cream);font:400 .85rem 'Poppins';letter-spacing:.04em;text-decoration:none;cursor:pointer;backdrop-filter:blur(4px);transition:transform .25s,background .25s}
.btn:active{transform:scale(.95);background:var(--gold);color:var(--navy)}
.cd{display:flex;gap:8px;justify-content:center}
.cd div{width:62px;padding:8px 0;border-radius:14px;border:1px solid rgba(217,184,120,.6);background:rgba(5,35,62,.55)}
.cd b{display:block;font:500 1.35rem 'Poppins'}
.cd span{font-size:.62rem;letter-spacing:.08em;opacity:.8}
.card{position:absolute;left:12%;right:12%;cursor:pointer}
.hint{font:300 .72rem 'Poppins';font-style:italic;opacity:.85}

/* ---------- RSVP ---------- */
#rsvp{padding:70px 28px;text-align:center;background:radial-gradient(120% 70% at 50% 0%,#0b3a63,var(--navy) 70%)}
#rsvp h2{font:400 2.8rem 'Pinyon Script',cursive;line-height:1.2;margin-bottom:10px}
#rsvp p{font-weight:300;font-size:.88rem;opacity:.85}
form{display:grid;gap:12px;margin-top:26px;text-align:left}
input,select,textarea{width:100%;padding:14px 16px;border:1px solid rgba(217,184,120,.5);border-radius:14px;background:rgba(255,255,255,.07);color:var(--cream);font:300 .9rem 'Poppins'}
select option{color:#111}
::placeholder{color:rgba(243,234,214,.55)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:1px}
form .btn{padding:14px;background:var(--gold);color:var(--navy);font-weight:500;border:0}

/* ---------- AMBIEN ---------- */
#fx{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden}
#fx i{position:absolute;bottom:-10px;border-radius:50%;background:radial-gradient(circle,#fff6d8,rgba(217,184,120,0) 70%);animation:rise linear infinite,tw 2.4s ease-in-out infinite}
@keyframes rise{to{transform:translateY(-110vh)}}
@keyframes tw{50%{opacity:.25}}
#music{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:40;width:44px;height:44px;border-radius:50%;border:1px solid var(--gold);background:rgba(5,35,62,.8);color:var(--cream);font-size:1.1rem;display:none;cursor:pointer}
#music.spin{animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;bottom:76px;transform:translate(-50%,20px);background:var(--gold);color:var(--navy);padding:9px 20px;border-radius:99px;font-size:.82rem;opacity:0;transition:.4s;z-index:60;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}.slide{opacity:1;transform:none;filter:none}}
</style>
</head>
<body class="lock">

<!-- ====== COVER: ketuk amplop ====== -->
<div id="cover">
  <div class="stage">
    <img src="01-cover.webp" alt="Cover undangan">
    <span class="seal-ring"></span><span class="seal-ring b"></span>
    <div class="name">Kepada Yth.<b id="guest">Tamu Undangan</b></div>
  </div>
</div>

<div id="fx"></div>
<button id="music" aria-label="Musik">♪</button>
<div id="toast"></div>

<main id="wrap">
  <div class="slide"><img class="bg" src="02-ayat.webp" alt="Ayat"></div>
  <div class="slide"><img class="bg" src="03-mempelai.webp" alt="Mempelai"></div>

  <div class="slide"><img class="bg" src="04-savedate.webp" alt="Save the date">
    <div class="ov" style="top:51%"><div class="cd" id="cd"></div></div>
    <div class="ov" style="top:62%"><a class="btn" id="saveDate" href="#" target="_blank" rel="noopener">Simpan di kalender</a></div>
  </div>

  <div class="slide"><img class="bg" src="05-acara.webp" alt="Akad dan resepsi">
    <div class="ov" style="top:47%"><a class="btn" id="maps" href="#" target="_blank" rel="noopener">Buka Google Maps</a></div>
  </div>

  <div class="slide"><img class="bg" src="07-galeri.webp" alt="Galeri"></div>

  <div class="slide" id="gift"><img class="bg" src="06-gift.webp" alt="Wedding gift">
    <div class="card" id="c1" style="top:40%;height:26%"></div>
    <div class="card" id="c2" style="top:70%;height:28%"></div>
    <div class="ov hint" style="top:66.6%">ketuk kartu untuk menyalin nomor</div>
  </div>

  <section id="rsvp">
    <h2>Konfirmasi Kehadiran</h2>
    <p>Isi di bawah, lalu pesan terbuka di WhatsApp mempelai.</p>
    <form id="form">
      <input id="nm" placeholder="Nama Anda" required maxlength="80">
      <select id="st"><option>Hadir</option><option>Tidak hadir</option></select>
      <select id="jm"><option>1 orang</option><option>2 orang</option><option>3 orang</option><option>4 orang</option></select>
      <textarea id="ms" rows="3" placeholder="Ucapan dan doa untuk kami" maxlength="300"></textarea>
      <button class="btn" type="submit">Kirim lewat WhatsApp</button>
    </form>
  </section>

  <div class="slide"><img class="bg" src="08-penutup.webp" alt="Penutup"></div>
</main>

<script>
/* ====== UBAH DATA DI SINI ====== */
const DATA = {
  tanggal: "2026-12-20T09:00:00+07:00",
  kalenderMulai: "20261220T020000Z", kalenderAkhir: "20261220T060000Z",
  judulKalender: "Pernikahan Rama & Tama",
  wa: "6281234567890",                 // nomor WA mempelai: 62..., tanpa +
  musik: "",                           // contoh: "musik.mp3"
  lokasi: "Horison Altama Pandeglang",
  rekening: ["112345678910", "112345678910"]   // kartu atas, kartu bawah (samakan dengan desain)
};
/* =============================== */

const $ = s => document.querySelector(s);
const toast = t => { const e=$('#toast'); e.textContent=t; e.classList.add('on'); setTimeout(()=>e.classList.remove('on'),1800); };

// Nama tamu dari link: ?to=Nama
const to = new URLSearchParams(location.search).get('to');
if (to) $('#guest').textContent = to.slice(0,60);

// Link
$('#saveDate').href = 'https://www.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(DATA.judulKalender)+'&dates='+DATA.kalenderMulai+'/'+DATA.kalenderAkhir;
$('#maps').href = 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(DATA.lokasi);

// Salin rekening
['c1','c2'].forEach((id,i)=>{ $('#'+id).onclick=()=>navigator.clipboard.writeText(DATA.rekening[i]).then(()=>toast('Nomor tersalin')).catch(()=>toast('Gagal menyalin')); });

// Countdown
const cd=$('#cd');
function tick(){
  let d=new Date(DATA.tanggal)-Date.now(); if(d<0)d=0;
  cd.innerHTML=[['Hari',864e5],['Jam',36e5],['Menit',6e4],['Detik',1e3]].map(([l,m])=>{const x=Math.floor(d/m);d-=x*m;return `<div><b>${String(x).padStart(2,'0')}</b><span>${l}</span></div>`}).join('');
}
tick(); setInterval(tick,1000);

// Kilau emas melayang
const fx=$('#fx');
for(let i=0;i<20;i++){ const s=document.createElement('i'), z=3+Math.random()*7;
  s.style.cssText=`left:${Math.random()*100}%;width:${z}px;height:${z}px;animation-duration:${14+Math.random()*16}s,${1.8+Math.random()*2}s;animation-delay:${-Math.random()*20}s,${-Math.random()*3}s`; fx.appendChild(s); }

// Muncul halus saat scroll
const io=new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('show'); io.unobserve(e.target);} }),{threshold:.12});
document.querySelectorAll('.slide').forEach(e=>io.observe(e));

// Musik
const mb=$('#music'); let audio=null;
if(DATA.musik){ audio=new Audio(DATA.musik); audio.loop=true; mb.style.display='block'; }
mb.onclick=()=>{ if(audio.paused){audio.play();mb.classList.add('spin');}else{audio.pause();mb.classList.remove('spin');} };

// Buka amplop
$('#cover').onclick=()=>{
  const c=$('#cover'); if(c.classList.contains('open')) return;
  c.classList.add('open'); document.body.classList.remove('lock');
  if(audio) audio.play().then(()=>mb.classList.add('spin')).catch(()=>{});
};

// RSVP -> WhatsApp
$('#form').onsubmit=e=>{
  e.preventDefault();
  const t=`Halo, saya ${$('#nm').value}.\nKonfirmasi: ${$('#st').value} (${$('#jm').value})\nUcapan: ${$('#ms').value||'-'}`;
  window.open('https://wa.me/'+DATA.wa+'?text='+encodeURIComponent(t),'_blank');
};
</script>
</body>
</html>
